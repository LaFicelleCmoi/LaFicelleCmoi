name: Génère la comète de contributions

on:
  schedule:
    - cron: '0 3 * * *' # chaque nuit à 3h
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: LaFicelleCmoi
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#4c1d95
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#0b1220,#2e1065,#5b21b6,#a78bfa,#f5f3ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
