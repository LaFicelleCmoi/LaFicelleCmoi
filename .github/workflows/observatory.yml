name: L'observatoire — télémétrie live

on:
  schedule:
    - cron: '0 6,18 * * *' # deux fois par jour : la Lune tourne, les fusées décollent
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-observatory.mjs'
      - '.github/workflows/observatory.yml'

permissions:
  contents: write

concurrency:
  group: observatory
  cancel-in-progress: true

jobs:
  observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Génère l'observatoire
        # GH_PAT est optionnel : il ajoute les contributions privées au total.
        # Sans lui, GITHUB_TOKEN suffit pour les données publiques.
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-observatory.mjs dist/observatory.svg

      # Branche dédiée : snake.yml force-push `output`, les deux se
      # marcheraient dessus si elles partageaient la même cible.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: telemetry
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
